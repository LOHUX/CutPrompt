<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Temporarily Unavailable - CutPrompts</title>
    <meta name="description" content="CutPrompts is temporarily unavailable. Try again shortly.">
    
    <!-- SEO Meta Tags -->
    <link rel="canonical" href="https://cutprompt.vercel.app/">
    <meta name="robots" content="noindex, follow">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Service Temporarily Unavailable - CutPrompts">
    <meta property="og:description" content="CutPrompts is temporarily unavailable. Try again shortly.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://cutprompt.vercel.app/">
    <meta property="og:site_name" content="CutPrompts">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Service Temporarily Unavailable - CutPrompts">
    <meta name="twitter:description" content="CutPrompts is temporarily unavailable. Try again shortly.">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #f0f4f8, #e2e8f0);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #334155;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }
        
        .error-code {
            font-size: 6rem;
            font-weight: 800;
            color: #006400;
            margin-bottom: 1rem;
            line-height: 1;
        }
        
        .error-title {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #006400;
        }
        
        .error-description {
            font-size: 1.125rem;
            margin-bottom: 2rem;
            line-height: 1.6;
            color: #006400;
        }
        
        
        .home-link {
            display: inline-block;
            margin-top: 1rem;
            color: #006400;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .home-link:hover {
            color: #008000;
            text-decoration: underline;
        }
        
        @media (max-width: 640px) {
            .error-code {
                font-size: 4rem;
            }
            
            .error-title {
                font-size: 2rem;
            }
            
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">503</div>
        <h1 class="error-title">Service Temporarily Unavailable</h1>
        <p class="error-description">CutPrompts is temporarily unavailable. Please try again shortly.</p>
        <a href="/" class="home-link">← Back to CutPrompts</a>
    </div>
</body>
</html>
